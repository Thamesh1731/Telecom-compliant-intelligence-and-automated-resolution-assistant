name: 🚀 Automatic AWS CI/CD Deployment

on:
  push:
    branches:
      - main
      - master
      - thamesh-work
      - 'feature/**'

jobs:
  deploy-frontend-s3:
    name: 📦 Build & Deploy Frontend to AWS S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install --legacy-peer-deps

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: "http://54.91.159.187:8000"
          VITE_API_BASE_URL: "http://54.91.159.187:8000"
        run: |
          cd frontend
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy Assets to S3 Bucket
        run: |
          if [ -d "frontend/out" ]; then
            aws s3 sync frontend/out/ s3://${{ secrets.AWS_S3_BUCKET || 'telecom-assistant-frontend-free-2026' }}/ --delete
          elif [ -d "frontend/dist" ]; then
            aws s3 sync frontend/dist/ s3://${{ secrets.AWS_S3_BUCKET || 'telecom-assistant-frontend-free-2026' }}/ --delete
          fi

      - name: Clear CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || 'E32TBBKW2WX5ZV' }} --paths "/*" || true

  deploy-backend-ec2:
    name: 🖥️ Deploy FastAPI Backend to AWS EC2
    runs-on: ubuntu-latest
    needs: deploy-frontend-s3
    steps:
      - name: SSH and Deploy to EC2 Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || '54.91.159.187' }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd ~/Telecom-compliant-intelligence-and-automated-resolution-assistant
            git fetch origin
            git pull origin main || git pull origin thamesh-work
            source .venv/bin/activate
            pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
            pip install --no-cache-dir -r requirements.txt
            sudo systemctl restart telecom-backend
